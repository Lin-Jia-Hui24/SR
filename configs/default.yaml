seed: 42
device: auto
output_dir: outputs/edsr_realsr_x2

model:
  scale: 2
  num_features: 256
  num_blocks: 32
  res_scale: 0.1

data:
  # RealSR native LR/HR pairs are x2. Fetch data with the command in README.
  mode: realsr_x2
  manifest: data_pipeline/splits/realsr_x2.json
  root: data/realsr
  patch_size: 96
  augmentation: geometry
  train_hr_dir: null
  val_hr_dir: null
  train_lr_dir: null
  val_lr_dir: null
  num_workers: 0
  augment: true

train:
  epochs: 300
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0
  milestones: [200, 250]
  gamma: 0.5
  save_every: 10
  resume: null
  # Optional published EDSR .pt/.pth file. This initializes training only; it does not restore optimizer state.
  pretrained: null
  pretrained_strict: true
  amp: true
